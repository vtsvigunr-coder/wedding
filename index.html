<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Zohan &amp; Rose — Invitation</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>" />
  </head>
  <body>
    <header class="site-header" id="site-header">
      <p class="site-header__title">Invitation</p>
      <button class="site-header__sound" id="sound-toggle" type="button" aria-label="Toggle music" aria-pressed="true" disabled>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0.25" y="0.25" width="23.5" height="23.5" rx="11.75" stroke="black" stroke-width="0.5"/>
          <clipPath id="sound-wave-clip">
            <rect x="7" y="9.5" width="10" height="5" />
          </clipPath>
          <g clip-path="url(#sound-wave-clip)">
            <path class="site-header__sound-wave" d="M7,12 C7.625,10.7 8.875,10.7 9.5,12 C10.125,13.3 11.375,13.3 12,12 C12.625,10.7 13.875,10.7 14.5,12 C15.125,13.3 16.375,13.3 17,12 C17.625,10.7 18.875,10.7 19.5,12 C20.125,13.3 21.375,13.3 22,12" stroke="black" stroke-width="0.5" stroke-linecap="round" fill="none"/>
          </g>
        </svg>
      </button>
    </header>

    <section class="preloader" id="preloader">
      <video class="preloader__video" id="preloader-video" src="/preloader.mp4" muted playsinline preload="auto"></video>
      <div class="preloader__hint" id="preloader-hint">
        <img class="preloader__chevron" src="/icons/Chevron_Up_Duo.svg" alt="" />
        <button class="preloader__click" id="preloader-click" type="button">
          <span>Click</span>
          <img class="preloader__click-ring" src="/icons/click-ring.svg" alt="" />
        </button>
      </div>
      <div class="preloader__scroll" id="preloader-scroll">
        <p>Scroll down</p>
        <img src="/icons/Arrows.svg" alt="" />
      </div>
    </section>

    <section class="greeting" id="greeting">
      <p class="greeting__label">Our wedding day</p>
      <h2 class="greeting__title">Dear guest !</h2>
      <img class="greeting__paper" src="/icons/greeting-paper.png" alt="" />
      <img class="greeting__envelope" src="/icons/greeting-envelope.png" alt="" />
      <img class="greeting__divider" src="/icons/divider.png" alt="" />
    </section>

    <audio id="bg-music" src="/music/wedding-music.mp3" loop preload="auto"></audio>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
